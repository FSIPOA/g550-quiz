<!DOCTYPE html>
<html lang="en">
<head>

<title>G550 Fuel System Functional Check</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  body {
    margin: 0;
    background: #1a1d21;
    font-family: 'Courier New', monospace;
    color: #e8e8e8;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 12px 40px;
  }
  h1 { font-size: 18px; letter-spacing: 1px; margin: 0 0 4px; text-align: center; }
  .subtitle { font-size: 12px; color: #9aa0a8; margin-bottom: 16px; text-align: center; }
  .stage { position: relative; width: 100%; max-width: 720px; }
  svg { display: block; width: 100%; height: auto; }

  .fc-switch { fill: transparent; stroke: none; cursor: pointer; }

  .fc-hint-ring {
    fill: none; stroke: #ffcc00; stroke-width: 3; opacity: 0; pointer-events: none;
  }
  .fc-hint-ring.active { animation: fcPulse 0.9s ease-in-out infinite; }
  @keyframes fcPulse {
    0%   { opacity: 0.15; stroke-width: 3; }
    50%  { opacity: 1;    stroke-width: 5; }
    100% { opacity: 0.15; stroke-width: 3; }
  }

  /* Motorized valve bar — rotates over 2s to simulate real valve transit time */
  .valve-bar { transform-box: fill-box; transform-origin: center; transition: transform 2s linear; }
  .valve-bar.open { transform: rotate(90deg); }

  .controls { display: flex; gap: 12px; margin-top: 18px; }
  button.fc-btn {
    background: #2a2e34; color: #e8e8e8; border: 1px solid #565c64; border-radius: 4px;
    padding: 8px 16px; font-family: 'Courier New', monospace; font-size: 13px; cursor: pointer;
  }
  button.fc-btn:hover { background: #383e46; }

  .status-line { margin-top: 14px; font-size: 13px; color: #9aa0a8; min-height: 18px; text-align: center; }
</style>
</head>

<script>
(function () {
  const VALVE_DELAY_MS = 2000; // motorized valve transit time
  const PUMP_CAS_DELAY_MS = 900; // brief pressure-decay delay before CAS illuminates

  const STEPS = [
    {
      id: 'crossfeed_valve',
      hintId: 'crossfeedHint',
      onCorrect: function () {
        document.getElementById('crossfeedValveBar').classList.add('open');
        setStatus('Crossfeed Valve — moving to OPEN...');
        setTimeout(function () {
          recolor('.fc-crossfeed-live', '#3aee6a');
          hideCAS();
          setStatus('Crossfeed Valve — OPEN confirmed.');
        }, VALVE_DELAY_MS);
      },
      onUndo: function () {
        snapValve('crossfeedValveBar', false);
        recolor('.fc-crossfeed-live', '#aaaaaa');
        document.getElementById('crossfeedValveCircle').setAttribute('stroke', '#c0c0c0');
        showCAS('R FUEL PRESSURE LOW');
        setStatus('Crossfeed Valve — back to CLOSED. Try it again.');
      }
    },
    {
      id: 'intertank_valve',
      hintId: 'intertankHint',
      onCorrect: function () {
        document.getElementById('intertankValveBar').classList.add('open');
        setStatus('Intertank Valve — moving to OPEN...');
        setTimeout(function () {
          recolor('.fc-intertank-live', '#3aee6a');
          setStatus('Intertank Valve — OPEN confirmed.');
        }, VALVE_DELAY_MS);
      },
      onUndo: function () {
        snapValve('intertankValveBar', false);
        recolor('.fc-intertank-live', '#c0c0c0');
        setStatus('Intertank Valve — back to CLOSED. Try it again.');
      }
    },
    {
      id: 'left_main_pump',
      hintId: 'leftMainPumpHint',
      onCorrect: function () {
        recolor('.fc-left-main-pump, .fc-left-manifold-main-side, .fc-left-live, .fc-left-tap, .fc-crossfeed-live, .fc-intertank-live', '#aaaaaa');
        recolorStrokeOnly('.fc-left-live-stroke', '#aaaaaa');
        setStatus('Left Main Boost Pump — OFF confirmed.');
        setTimeout(function () {
          showCAS('L-R FUEL PRESSURE LOW');
        }, PUMP_CAS_DELAY_MS);
      },
      onUndo: function () {
        recolor('.fc-left-main-pump, .fc-left-manifold-main-side, .fc-left-live, .fc-left-tap, .fc-crossfeed-live, .fc-intertank-live', '#3aee6a');
        recolorStrokeOnly('.fc-left-live-stroke', '#3aee6a');
        hideCAS();
        setStatus('Left Main Boost Pump — back ON. Try it again.');
      }
    },
    {
      id: 'left_alt_pump',
      hintId: 'leftAltPumpHint',
      onCorrect: function () {
        recolor('.fc-left-alt-pump, .fc-left-manifold-alt-side, .fc-left-live, .fc-left-tap, .fc-crossfeed-live, .fc-intertank-live', '#3aee6a');
        recolorStrokeOnly('.fc-left-live-stroke', '#3aee6a');
        hideCAS();
        setStatus('Left Alternate Pump — ON confirmed.');
      },
      onUndo: function () {
        recolor('.fc-left-alt-pump, .fc-left-manifold-alt-side, .fc-left-live, .fc-left-tap, .fc-crossfeed-live, .fc-intertank-live', '#aaaaaa');
        recolorStrokeOnly('.fc-left-live-stroke', '#aaaaaa');
        showCAS('L-R FUEL PRESSURE LOW');
        setStatus('Left Alternate Pump — back OFF. Try it again.');
      }
    },
    {
      id: 'left_alt_pump',
      hintId: 'leftAltPumpHint',
      onCorrect: function () {
        recolor('.fc-left-alt-pump, .fc-left-manifold-alt-side, .fc-left-live, .fc-left-tap, .fc-crossfeed-live, .fc-intertank-live', '#aaaaaa');
        recolorStrokeOnly('.fc-left-live-stroke', '#aaaaaa');
        setStatus('Left Alternate Pump — OFF confirmed.');
        setTimeout(function () {
          showCAS('L-R FUEL PRESSURE LOW');
        }, PUMP_CAS_DELAY_MS);
      },
      onUndo: function () {
        recolor('.fc-left-alt-pump, .fc-left-manifold-alt-side, .fc-left-live, .fc-left-tap, .fc-crossfeed-live, .fc-intertank-live', '#3aee6a');
        recolorStrokeOnly('.fc-left-live-stroke', '#3aee6a');
        hideCAS();
        setStatus('Left Alternate Pump — back ON. Try it again.');
      }
    },
    {
      id: 'right_main_pump',
      hintId: 'rightMainPumpHint',
      onCorrect: function () {
        recolor('.fc-right-main-pump, .fc-right-manifold-main-side, .fc-right-tap, .fc-crossfeed-live, .fc-left-live, .fc-intertank-live', '#3aee6a');
        recolorStrokeOnly('.fc-left-live-stroke', '#3aee6a');
        hideCAS();
        setStatus('Right Main Boost Pump — ON confirmed.');
      },
      onUndo: function () {
        recolor('.fc-right-main-pump, .fc-right-manifold-main-side, .fc-right-tap, .fc-crossfeed-live, .fc-left-live, .fc-intertank-live', '#aaaaaa');
        recolorStrokeOnly('.fc-left-live-stroke', '#aaaaaa');
        showCAS('L-R FUEL PRESSURE LOW');
        setStatus('Right Main Boost Pump — back OFF. Try it again.');
      }
    },
    {
      id: 'right_main_pump',
      hintId: 'rightMainPumpHint',
      onCorrect: function () {
        recolor('.fc-right-main-pump, .fc-right-manifold-main-side, .fc-right-tap, .fc-crossfeed-live, .fc-left-live, .fc-intertank-live', '#aaaaaa');
        recolorStrokeOnly('.fc-left-live-stroke', '#aaaaaa');
        setStatus('Right Main Boost Pump — OFF confirmed.');
        setTimeout(function () {
          showCAS('L-R FUEL PRESSURE LOW');
        }, PUMP_CAS_DELAY_MS);
      },
      onUndo: function () {
        recolor('.fc-right-main-pump, .fc-right-manifold-main-side, .fc-right-tap, .fc-crossfeed-live, .fc-left-live, .fc-intertank-live', '#3aee6a');
        recolorStrokeOnly('.fc-left-live-stroke', '#3aee6a');
        hideCAS();
        setStatus('Right Main Boost Pump — back ON. Try it again.');
      }
    },
    {
      id: 'right_alt_pump',
      hintId: 'rightAltPumpHint',
      onCorrect: function () {
        recolor('.fc-right-alt-pump, .fc-right-manifold-alt-side, .fc-right-tap, .fc-crossfeed-live, .fc-left-live, .fc-intertank-live', '#3aee6a');
        recolorStrokeOnly('.fc-left-live-stroke', '#3aee6a');
        hideCAS();
        setStatus('Right Alternate Pump — ON confirmed.');
      },
      onUndo: function () {
        recolor('.fc-right-alt-pump, .fc-right-manifold-alt-side, .fc-right-tap, .fc-crossfeed-live, .fc-left-live, .fc-intertank-live', '#aaaaaa');
        recolorStrokeOnly('.fc-left-live-stroke', '#aaaaaa');
        showCAS('L-R FUEL PRESSURE LOW');
        setStatus('Right Alternate Pump — back OFF. Try it again.');
      }
    },
    {
      id: 'crossfeed_valve',
      hintId: 'crossfeedHint',
      onCorrect: function () {
        document.getElementById('crossfeedValveBar').classList.remove('open');
        setStatus('Crossfeed Valve — moving to CLOSED...');
        setTimeout(function () {
          recolor('.fc-left-live', '#aaaaaa');
          recolorStrokeOnly('.fc-left-live-stroke', '#aaaaaa');
          document.getElementById('crossfeedValveCircle').setAttribute('stroke', '#c0c0c0');
          document.getElementById('crossfeedValveBar').setAttribute('stroke', '#c0c0c0');
          showCAS('L FUEL PRESSURE LOW');
          setStatus('Crossfeed Valve — CLOSED confirmed.');
        }, VALVE_DELAY_MS);
      },
      onUndo: function () {
        snapValve('crossfeedValveBar', true);
        recolor('.fc-left-live', '#3aee6a');
        recolorStrokeOnly('.fc-left-live-stroke', '#3aee6a');
        document.getElementById('crossfeedValveCircle').setAttribute('stroke', '#3aee6a');
        document.getElementById('crossfeedValveBar').setAttribute('stroke', '#3aee6a');
        hideCAS();
        setStatus('Crossfeed Valve — back OPEN. Try it again.');
      }
    },
    {
      id: 'intertank_valve',
      hintId: 'intertankHint',
      onCorrect: function () {
        document.getElementById('intertankValveBar').classList.remove('open');
        setStatus('Intertank Valve — moving to CLOSED...');
        setTimeout(function () {
          recolor('.fc-intertank-live', '#c0c0c0');
          setStatus('Intertank Valve — CLOSED confirmed.');
        }, VALVE_DELAY_MS);
      },
      onUndo: function () {
        snapValve('intertankValveBar', true);
        recolor('.fc-intertank-live', '#3aee6a');
        setStatus('Intertank Valve — back OPEN. Try it again.');
      }
    },
    {
      id: 'left_main_pump',
      hintId: 'leftMainPumpHint',
      onCorrect: function () {
        // Crossfeed is closed here, so this only re-powers the left side —
        // it does not reach across to the right side.
        recolor('.fc-left-main-pump, .fc-left-manifold-main-side, .fc-left-live, .fc-left-tap', '#3aee6a');
        recolorStrokeOnly('.fc-left-live-stroke', '#3aee6a');
        hideCAS();
        setStatus('Left Main Boost Pump — ON confirmed.');
      },
      onUndo: function () {
        recolor('.fc-left-main-pump, .fc-left-manifold-main-side, .fc-left-live, .fc-left-tap', '#aaaaaa');
        recolorStrokeOnly('.fc-left-live-stroke', '#aaaaaa');
        showCAS('L FUEL PRESSURE LOW');
        setStatus('Left Main Boost Pump — back OFF. Try it again.');
      }
    },
    {
      id: 'right_alt_pump',
      hintId: 'rightAltPumpHint',
      onCorrect: function () {
        // Valve stays untouched here — only the right-side lines drop out.
        recolor('.fc-right-alt-pump, .fc-right-manifold-alt-side, .fc-right-tap, .fc-crossfeed-live:not(#crossfeedValveCircle):not(#crossfeedValveBar)', '#aaaaaa');
        setStatus('Right Alternate Pump — OFF confirmed.');
        setTimeout(function () {
          showCAS('R FUEL PRESSURE LOW');
          setStatus('Functional check complete.');
        }, PUMP_CAS_DELAY_MS);
      },
      onUndo: function () {
        recolor('.fc-right-alt-pump, .fc-right-manifold-alt-side, .fc-right-tap, .fc-crossfeed-live:not(#crossfeedValveCircle):not(#crossfeedValveBar)', '#3aee6a');
        hideCAS();
        setStatus('Right Alternate Pump — back ON. Try it again.');
      }
    }
    // Functional check complete
  ];

  let currentStep = 0;
  let wrongAttempts = 0;

  document.getElementById('stepTotal').textContent = STEPS.length;

  function recolor(selector, color) {
    document.querySelectorAll(selector).forEach(function (el) {
      if (el.hasAttribute('stroke') && el.getAttribute('stroke') !== 'none') {
        el.setAttribute('stroke', color);
      }
      if (el.hasAttribute('fill') && el.getAttribute('fill') !== 'none') {
        el.setAttribute('fill', color);
      }
    });
  }

  function recolorStrokeOnly(selector, color) {
    document.querySelectorAll(selector).forEach(function (el) {
      if (el.hasAttribute('stroke') && el.getAttribute('stroke') !== 'none') {
        el.setAttribute('stroke', color);
      }
    });
  }

  function showCAS(message) {
    const casText = document.getElementById('casText');
    casText.textContent = message;
    casText.setAttribute('opacity', '1');
  }

  function hideCAS() {
    const casText = document.getElementById('casText');
    casText.setAttribute('opacity', '0');
    casText.textContent = '';
  }

  function setStatus(msg) {
    document.getElementById('statusLine').textContent = msg;
  }

  // Instantly snaps a valve bar open/closed with no transition — used for
  // undo, since reversing a step is a training convenience, not something
  // that needs to mimic real valve transit time.
  function snapValve(barId, open) {
    const bar = document.getElementById(barId);
    bar.style.transition = 'none';
    bar.classList.toggle('open', open);
    void bar.offsetWidth; // force reflow so the transition:none takes effect immediately
    bar.style.transition = '';
  }

  function clearAllHints() {
    document.querySelectorAll('.fc-hint-ring').forEach(function (el) {
      el.classList.remove('active');
    });
  }

  function handleSwitchClick(stepId) {
    if (currentStep >= STEPS.length) return;
    const expected = STEPS[currentStep];
    if (stepId === expected.id) {
      wrongAttempts = 0;
      clearAllHints();
      expected.onCorrect();
      currentStep++;
      document.getElementById('stepNum').textContent = Math.min(currentStep + 1, STEPS.length);
    } else {
      wrongAttempts++;
      if (wrongAttempts >= 3) {
        const ring = document.getElementById(expected.hintId);
        if (ring) ring.classList.add('active');
      }
    }
  }

  document.querySelectorAll('.fc-switch').forEach(function (el) {
    el.addEventListener('click', function () {
      handleSwitchClick(el.dataset.stepId);
    });
  });

  document.getElementById('undoBtn').addEventListener('click', function () {
    if (currentStep <= 0) return;
    currentStep--;
    wrongAttempts = 0;
    clearAllHints();
    STEPS[currentStep].onUndo();
    document.getElementById('stepNum').textContent = currentStep + 1;
  });

  document.getElementById('resetBtn').addEventListener('click', function () {
    currentStep = 0;
    wrongAttempts = 0;
    clearAllHints();
    document.getElementById('crossfeedValveBar').classList.remove('open');
    document.getElementById('intertankValveBar').classList.remove('open');
    snapValve('crossfeedValveBar', false);
    snapValve('intertankValveBar', false);
    recolor('.fc-crossfeed-live', '#aaaaaa');
    document.getElementById('crossfeedValveCircle').setAttribute('stroke', '#c0c0c0');
    document.getElementById('crossfeedValveBar').setAttribute('stroke', '#c0c0c0');
    recolor('.fc-intertank-live', '#c0c0c0');
    recolor('.fc-left-live', '#3aee6a');
    recolor('.fc-left-tap', '#3aee6a');
    recolor('.fc-left-main-pump', '#3aee6a');
    recolor('.fc-left-manifold-main-side', '#3aee6a');
    recolor('.fc-left-alt-pump', '#aaaaaa');
    recolor('.fc-left-manifold-alt-side', '#aaaaaa');
    recolor('.fc-right-main-pump', '#aaaaaa');
    recolor('.fc-right-alt-pump', '#aaaaaa');
    recolor('.fc-right-manifold-main-side', '#aaaaaa');
    recolor('.fc-right-manifold-alt-side', '#aaaaaa');
    recolor('.fc-right-tap', '#aaaaaa');
    recolorStrokeOnly('.fc-left-live-stroke', '#3aee6a');
    document.getElementById('stepNum').textContent = 1;
    showCAS('R FUEL PRESSURE LOW');
    setStatus('Baseline: APU running on Left Main pump. Begin the check.');
  });

  // Initial state: crossfeed closed, so right side is unpowered from the start
  showCAS('R FUEL PRESSURE LOW');
})();
</script>

</body>
